[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhishu-agent"
version = "0.2.0"
description = "从零拆解 Codex / Claude Code 式编码智能体：8 个零依赖可运行的 Harness 设计模式与 wg-harness CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "王果 (wangguode)", email = "wangguode@users.noreply.github.com" }
]
dependencies = []

[project.scripts]
wg-harness = "wg_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wg_harness", "labs"]
